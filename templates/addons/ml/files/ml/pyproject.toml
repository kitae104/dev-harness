[project]
name = "app-ml"
version = "0.1.0"
description = "딥러닝·데이터 실험 작업 공간 (PyTorch, Jupyter)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.8",
    "numpy>=2.1",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "matplotlib>=3.10",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]
notebook = [
    "jupyterlab>=4.4",
    "ipykernel>=6.30",
    "ipywidgets>=8.1",
]

[tool.uv]
# uv sync 한 번으로 Jupyter 까지 설치합니다. 학습 서버 등에서 빼려면 uv sync --no-group notebook
default-groups = ["dev", "notebook"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

# PyTorch 를 어디서 받을지 (생성할 때 고른 --ml-device). 바꾸려면 아래 url 을 바꾸고 uv lock 을 다시 실행하세요.
#   CPU: https://download.pytorch.org/whl/cpu   NVIDIA GPU(CUDA 12.8): https://download.pytorch.org/whl/cu128
# macOS 는 PyPI 의 기본 빌드가 Apple GPU(MPS)까지 지원하므로 항상 PyPI 에서 받습니다.
# @addon:torch-index

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
