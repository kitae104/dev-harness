  # Jupyter Lab (딥러닝 작업 공간, NVIDIA GPU). make up 으로는 뜨지 않고 make ml-up 으로 따로 켭니다 (profiles).
  # GPU 를 쓰려면 호스트에 NVIDIA 드라이버와 NVIDIA Container Toolkit(Windows 는 Docker Desktop + WSL2)이 필요합니다.
  jupyter:
    build: ./ml
    image: ${COMPOSE_PROJECT_NAME:-app}-jupyter
    container_name: ${COMPOSE_PROJECT_NAME:-app}-jupyter
    profiles: ["ml"]
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?.env 에 JUPYTER_TOKEN 을 설정하세요}
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./ml:/workspace
    networks:
      - app-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
