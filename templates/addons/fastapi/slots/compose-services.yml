  fastapi:
    build: ./fastapi
    image: ${COMPOSE_PROJECT_NAME:-app}-fastapi
    container_name: ${COMPOSE_PROJECT_NAME:-app}-fastapi
    environment:
      # Spring 백엔드와 같은 비밀값으로 JWT 를 검증합니다.
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://localhost:5173}
    ports:
      - "127.0.0.1:${FASTAPI_PORT:-8000}:8000"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/py/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
