      # 제공자는 .env 의 AI_PROVIDER 하나로 바꿉니다 (openai | anthropic | ollama). 바꾼 뒤 make up.
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-240}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      # 기본은 이 프로젝트의 Ollama 컨테이너. PC 에 직접 설치한 Ollama(macOS 앱 등)를 쓰려면 .env 에서
      # OLLAMA_DOCKER_URL=http://host.docker.internal:11434 로 바꿉니다.
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
