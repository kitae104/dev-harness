  frontend:
    build: ./frontend
    image: ${COMPOSE_PROJECT_NAME:-app}-frontend
    container_name: ${COMPOSE_PROJECT_NAME:-app}-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - app-net
    depends_on:
      backend:
        condition: service_healthy
      # @addon:compose-frontend-depends
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped
