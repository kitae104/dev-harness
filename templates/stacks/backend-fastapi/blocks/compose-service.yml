  backend:
    build: ./backend
    image: ${COMPOSE_PROJECT_NAME:-app}-backend
    container_name: ${COMPOSE_PROJECT_NAME:-app}-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME:-app}:${DB_PASSWORD:-app}@db:5432/${DB_NAME:-app}
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요}
      JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:-3600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://localhost:5173}
      # @addon:compose-backend-env
    # 컨테이너에서 PC 의 서비스(예: PC 에 설치한 Ollama)에 host.docker.internal 로 붙을 수 있게 (Linux 에서도)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - app-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped
