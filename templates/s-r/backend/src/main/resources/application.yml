spring:
  application:
    name: app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # 파일 업로드 최대 크기 (기본 1MB). 프런트엔드 nginx 의 client_max_body_size 와 맞춥니다.
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_SIZE:25MB}
  # @addon:spring-yml

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # 운영 환경에서는 반드시 JWT_SECRET 환경 변수로 32바이트 이상의 임의 문자열을 지정하세요.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes-or-more}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  # @addon:app-yml
